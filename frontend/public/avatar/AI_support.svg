<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with vibrant gradient -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" />

  <!-- Orbit Ring behind head -->
  <ellipse cx="50" cy="48" rx="40" ry="14" fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-dasharray="6 4" transform="rotate(-15 50 48)" opacity="0.6" />

  <!-- Robot Body / Collar -->
  <path d="M 32 78 Q 50 72 68 78 L 64 88 Q 50 91 36 88 Z" fill="url(#headGrad)" />

  <!-- Neck -->
  <rect x="44" y="68" width="12" height="7" rx="3" fill="#c7d2fe" />

  <!-- Robot Head -->
  <rect x="26" y="28" width="48" height="40" rx="16" fill="url(#headGrad)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))" />

  <!-- Antenna -->
  <rect x="48" y="17" width="4" height="12" rx="2" fill="#818cf8" />
  <circle cx="50" cy="15" r="5" fill="url(#cyanGlow)" filter="url(#glow)" />

  <!-- Headphones / Ears -->
  <rect x="21" y="37" width="6" height="20" rx="3" fill="#6366f1" />
  <rect x="73" y="37" width="6" height="20" rx="3" fill="#6366f1" />
  <circle cx="24" cy="47" r="2.5" fill="#38bdf8" />
  <circle cx="76" cy="47" r="2.5" fill="#38bdf8" />

  <!-- Black Visor Face -->
  <rect x="31" y="34" width="38" height="27" rx="11" fill="#0f172a" />

  <!-- Friendly Glowing Eyes -->
  <ellipse cx="41" cy="46" rx="4.5" ry="6" fill="url(#cyanGlow)" filter="url(#glow)" />
  <ellipse cx="59" cy="46" rx="4.5" ry="6" fill="url(#cyanGlow)" filter="url(#glow)" />
  <!-- Eye highlights -->
  <circle cx="42.5" cy="44" r="1.8" fill="#ffffff" />
  <circle cx="60.5" cy="44" r="1.8" fill="#ffffff" />

  <!-- Smile -->
  <path d="M 46 54 Q 50 57 54 54" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Front Orbit dot -->
  <circle cx="84" cy="40" r="3.5" fill="#38bdf8" filter="url(#glow)" />
</svg>